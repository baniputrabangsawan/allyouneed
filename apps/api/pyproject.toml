[project]
name = "utility-api"
version = "0.1.0"
description = "Backend API for the all-in-one utility web app."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "structlog>=24.4.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "cryptography>=43.0.0",
    "python-dateutil>=2.9.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "dramatiq[redis]>=1.17.0",
    "httpx>=0.27.0",
    "pillow>=11.0.0",
    "pymupdf>=1.24.0",
    "python-multipart>=0.0.12",
    "opencv-python-headless>=4.10,<5",
    "playwright>=1.48.0",
    "argon2-cffi>=23.1.0",
    "faster-whisper>=1.1.0",
    "piper-tts>=1.2.0",
]

[project.optional-dependencies]
ai = [
    "rembg>=2.0.60",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.45.0",
    "einops>=0.8.0",
    "kornia>=0.7.0",
    "timm>=1.0.0",
]

[project.scripts]
utility-license = "app.cli.licenses:main"
utility-admin = "app.cli.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "types-python-dateutil>=2.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
